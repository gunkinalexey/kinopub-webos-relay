services:
  backend:
    build:
      context: ./backend
      args:
        # WITH_FFMPEG=0 in .env builds an image without FFmpeg at all. Changing
        # it needs a rebuild (`docker compose up -d --build backend`), not just
        # a restart - it decides what goes into the image, not only what the
        # app is told.
        WITH_FFMPEG: ${WITH_FFMPEG:-1}
    environment:
      WITH_FFMPEG: ${WITH_FFMPEG:-1}
      KINOPUB_CLIENT_ID: ${KINOPUB_CLIENT_ID:-}
      KINOPUB_CLIENT_SECRET: ${KINOPUB_CLIENT_SECRET:-}
      KINOPUB_API_BASE: ${KINOPUB_API_BASE:-https://api.service-kp.com}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      STREAM_HOST_SUFFIXES: ${STREAM_HOST_SUFFIXES:-}
      MEDIA_REFERER: ${MEDIA_REFERER:-}
      MEDIA_ORIGIN: ${MEDIA_ORIGIN:-}
      AUDIO_HLS_ROOT: /data/audio_hls
      AUDIO_HLS_TTL: ${AUDIO_HLS_TTL:-3600}
      AUDIO_HLS_SEGMENT_SECONDS: ${AUDIO_HLS_SEGMENT_SECONDS:-4}
      AUDIO_HLS_START_BUCKET: ${AUDIO_HLS_START_BUCKET:-10}
      DB_PATH: /data/kp.db
      UPDATE_DIR: /update
    volumes:
      - kp_data:/data
      # Обмен с обновлятором, который живёт на хосте (deploy/updater.sh).
      # Контейнер не может пересобрать сам себя - команда умрёт вместе с ним,
      # - а давать ему docker.sock ради этого значит выдать root на хосте.
      # Поэтому пересборкой занимается скрипт снаружи, а этот каталог нужен
      # только чтобы обменяться двумя файлами: он пишет сюда status.json, а
      # приложение создаёт requested, когда пользователь нажал «Обновить».
      - ./update:/update
    restart: unless-stopped

  frontend:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  kp_data:
